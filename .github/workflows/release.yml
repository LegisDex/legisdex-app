name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            make_script: make:win:x64
            artifact_name: legisdex-windows-x64
          - name: macOS Intel
            os: macos-13
            make_script: make:mac:x64
            artifact_name: legisdex-macos-x64
          - name: macOS Apple Silicon
            os: macos-14
            make_script: make:mac:arm64
            artifact_name: legisdex-macos-arm64
          - name: Linux x64
            os: ubuntu-22.04
            make_script: make:linux:x64
            artifact_name: legisdex-linux-x64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build distributables
        run: npm run ${{ matrix.make_script }}
        env:
          CI: true
          LEGISDEX_WEB_URL: https://www.legisdex.com

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: out/make/**/*
          if-no-files-found: error

      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/make/**/*
